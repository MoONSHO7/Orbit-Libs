syntax = "Lua51"
column_width = 120
line_endings = "Unix"
indent_type = "Spaces"
indent_width = 4
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
space_after_function_names = "Never"
block_newline_gaps = "Never"

# Keep control flow structurally explicit for review and automated reasoning.
collapse_simple_statement = "Never"

[sort_requires]
enabled = false
